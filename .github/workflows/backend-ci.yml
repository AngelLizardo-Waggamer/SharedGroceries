name: backend-ci

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
    paths:
      - "BackSharedGroceries/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "BackSharedGroceries/**"

jobs:
  dotnet-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackSharedGroceries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore BackSharedGroceries.slnx

      - name: Verify formatting
        run: dotnet format BackSharedGroceries.slnx --verify-no-changes --severity error

      - name: Build solution
        run: dotnet build BackSharedGroceries.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BackSharedGroceries.Tests/BackSharedGroceries.Tests.csproj --configuration Release --verbosity normal
