name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment tfvars file name without extension
        required: true
        default: dev
      confirmation:
        description: Type DESTROY to confirm
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: Infra
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

jobs:
  destroy:
    if: github.event.inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=infra-${{ github.event.inputs.environment }}.tfstate"

      - name: Terraform destroy
        run: terraform destroy -auto-approve -var-file="envs/${{ github.event.inputs.environment }}.tfvars"
